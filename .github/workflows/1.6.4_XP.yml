name: Build Project64 for Windows XP

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-xp:
    runs-on: windows-2022

    steps:
      - name: Obter codigo-fonte oficial v1.6.4 (Git nativo)
        shell: cmd
        run: |
          git clone --depth 1 --branch Project64-1.6.4 https://github.com/pj64team/Project64-Legacy.git .

      - name: Instalar conjunto de ferramentas v141_xp com ATL e MFC
        shell: cmd
        run: |
          start /wait "" "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\setup.exe" modify --quiet --norestart --nocache --productId Microsoft.VisualStudio.Product.Enterprise --channelId VisualStudio.17.Release --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 --add Microsoft.VisualStudio.Component.WinXP --add Microsoft.VisualStudio.Component.VC.v141.ATL --add Microsoft.VisualStudio.Component.VC.v141.MFC

      - name: 1. Compilar versao optimizada para Pentium 4 Prescott
        shell: cmd
        run: |
          "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" Project64.sln /t:Rebuild /p:Configuration="Release for XP" /p:Platform="Win32" /p:PlatformToolset=v141_xp /p:Optimization=MaxSpeed /p:FavorSizeOrSpeed=Speed /p:EnableEnhancedInstructionSet=StreamingSIMDExtensions2
          mkdir dist\prescott
          copy "..\PJ64_1.6.2\Project64_1.6.3_XP.exe" "dist\prescott\Project64_1.6.4_XP_Prescott.exe"
          del /f /q "..\PJ64_1.6.2\Project64_1.6.3_XP.exe"
          dir dist\prescott\

      - name: 2. Compilar versao geral (Optimizada para tamanho)
        shell: cmd
        run: |
          "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" Project64.sln /t:Rebuild /p:Configuration="Release for XP" /p:Platform="Win32" /p:PlatformToolset=v141_xp /p:Optimization=MinSpace /p:FavorSizeOrSpeed=Size
          mkdir dist\release
          copy "..\PJ64_1.6.2\Project64_1.6.3_XP.exe" "dist\release\Project64_1.6.4_XP.exe"
          del /f /q "..\PJ64_1.6.2\Project64_1.6.3_XP.exe"
          dir dist\release\

      - name: 3. Compactar versao geral com UPX
        shell: cmd
        run: |
          choco install upx -y --no-progress
          upx --best dist\release\Project64_1.6.4_XP.exe
          dir dist\release\

      - name: Disponibilizar artefacto Prescott (Apenas temporario, sem Release)
        uses: actions/upload-artifact@v4
        with:
          name: Project64_1.6.4_XP_Prescott
          path: dist/prescott/Project64_1.6.4_XP_Prescott.exe
          retention-days: 90
          if-no-files-found: error

      - name: Publicar Release oficial no repositorio (/releases)
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.6.4-xp dist\release\Project64_1.6.4_XP.exe --title "Project64 Legacy v1.6.4 (Windows XP)" --notes "Compilacao oficial para Windows XP da versao 1.6.4 [The End], optimizada para tamanho e compactada com UPX." || gh release upload v1.6.4-xp dist\release\Project64_1.6.4_XP.exe --clobber
