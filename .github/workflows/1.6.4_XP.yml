name: Build Project64 for Windows XP

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-xp:
    runs-on: windows-2022

    steps:

      # ------------------------------------------------------------
      # 1. Obter exactamente o ramo 1.6.4 do repositório ORIGINAL
      # ------------------------------------------------------------
      - name: Obter codigo-fonte oficial v1.6.4
        uses: actions/checkout@v5
        with:
          repository: pj64team/Project64-Legacy
          ref: 1.6.4
          path: source
          fetch-depth: 1

      # ------------------------------------------------------------
      # 2. Instalar o toolset v141_xp
      # ------------------------------------------------------------
      - name: Instalar conjunto de ferramentas v141_xp
        shell: cmd
        run: |
          start /wait "" "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\setup.exe" modify --quiet --norestart --nocache --productId Microsoft.VisualStudio.Product.Enterprise --channelId VisualStudio.17.Release --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 --add Microsoft.VisualStudio.Component.WinXP --add Microsoft.VisualStudio.Component.VC.v141.ATL --add Microsoft.VisualStudio.Component.VC.v141.MFC

      # ------------------------------------------------------------
      # 3. Disponibilizar MSBuild sem caminho fixo
      # ------------------------------------------------------------
      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x86

      # ------------------------------------------------------------
      # 4. Build Prescott / SSE2
      #
      #    - x86
      #    - Windows XP
      #    - SSE2 forçado através de CL=/arch:SSE2
      #    - optimização para tamanho
      #    - sem alteração do código-fonte original
      #
      #    O Prescott suporta SSE2. Não existe uma opção
      #    MSVC específica "/arch:Prescott".
      # ------------------------------------------------------------
      - name: Compilar versao Prescott SSE2 optimizada para tamanho
        shell: cmd
        env:
          CL: /arch:SSE2
        run: |
          msbuild source\Project64.sln /t:Rebuild /p:Configuration="Release for XP" /p:Platform="Win32" /p:PlatformToolset=v141_xp /p:Optimization=MinSpace /p:FavorSizeOrSpeed=Size /p:InlineFunctionExpansion=OnlyExplicitInline

          if errorlevel 1 exit /b %errorlevel%

          if not exist "PJ64_1.6.2\Project64_1.6.3_XP.exe" (
            echo ERRO: executavel Prescott nao foi produzido.
            exit /b 1
          )

          if not exist "dist\prescott" mkdir "dist\prescott"

          copy /y "PJ64_1.6.2\Project64_1.6.3_XP.exe" "dist\prescott\Project64_1.6.4_XP_Prescott.exe"

          if errorlevel 1 exit /b %errorlevel%

          dir "dist\prescott"

      # ------------------------------------------------------------
      # 5. Build geral XP
      #
      #    - Windows XP
      #    - Win32
      #    - optimização para tamanho
      # ------------------------------------------------------------
      - name: Compilar versao geral XP optimizada para tamanho
        shell: cmd
        run: |
          msbuild source\Project64.sln /t:Rebuild /p:Configuration="Release for XP" /p:Platform="Win32" /p:PlatformToolset=v141_xp /p:Optimization=MinSpace /p:FavorSizeOrSpeed=Size /p:InlineFunctionExpansion=OnlyExplicitInline

          if errorlevel 1 exit /b %errorlevel%

          if not exist "PJ64_1.6.2\Project64_1.6.3_XP.exe" (
            echo ERRO: executavel XP nao foi produzido.
            exit /b 1
          )

          if not exist "dist\release" mkdir "dist\release"

          copy /y "PJ64_1.6.2\Project64_1.6.3_XP.exe" "dist\release\Project64_1.6.4_XP.exe"

          if errorlevel 1 exit /b %errorlevel%

          dir "dist\release"

      # ------------------------------------------------------------
      # 6. Instalar versao fixa do UPX
      # ------------------------------------------------------------
      - name: Instalar UPX
        shell: cmd
        run: |
          choco install upx --version=5.2.1 -y --no-progress

          if errorlevel 1 exit /b %errorlevel%

      # ------------------------------------------------------------
      # 7. Compactar AMBOS os executaveis
      # ------------------------------------------------------------
      - name: Compactar executaveis finais com UPX
        shell: cmd
        run: |
          upx --best "dist\release\Project64_1.6.4_XP.exe"
          if errorlevel 1 exit /b %errorlevel%

          upx --best "dist\prescott\Project64_1.6.4_XP_Prescott.exe"
          if errorlevel 1 exit /b %errorlevel%

          upx -t "dist\release\Project64_1.6.4_XP.exe"
          if errorlevel 1 exit /b %errorlevel%

          upx -t "dist\prescott\Project64_1.6.4_XP_Prescott.exe"
          if errorlevel 1 exit /b %errorlevel%

          dir "dist\release"
          dir "dist\prescott"

      # ------------------------------------------------------------
      # 8. Artifact Prescott APENAS
      # ------------------------------------------------------------
      - name: Publicar artefacto Prescott
        uses: actions/upload-artifact@v6
        with:
          name: Project64_1.6.4_XP_Prescott
          path: dist/prescott/Project64_1.6.4_XP_Prescott.exe
          retention-days: 90
          if-no-files-found: error

      # ------------------------------------------------------------
      # 9. Release do fork
      #
      #    O codigo-fonte usado foi o repositorio ORIGINAL.
      #    A release fica no repositorio onde a Action esta a correr.
      # ------------------------------------------------------------
      - name: Publicar Release no fork
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v1.6.4-xp
        run: |
          gh release view "%RELEASE_TAG%" --repo "%GITHUB_REPOSITORY%" >nul 2>&1

          if errorlevel 1 (
            gh release create "%RELEASE_TAG%" "dist\release\Project64_1.6.4_XP.exe" --repo "%GITHUB_REPOSITORY%" --target "%GITHUB_SHA%" --title "Project64 Legacy v1.6.4 (Windows XP)" --notes "Build Windows XP da versao 1.6.4, compilada a partir do ramo 1.6.4 do repositorio original pj64team/Project64-Legacy. Executavel optimizado para tamanho e compactado com UPX."
            if errorlevel 1 exit /b %errorlevel%
          ) else (
            gh release upload "%RELEASE_TAG%" "dist\release\Project64_1.6.4_XP.exe" --repo "%GITHUB_REPOSITORY%" --clobber
            if errorlevel 1 exit /b %errorlevel%
          )
