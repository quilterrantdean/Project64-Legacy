name: Build Project64 for Windows XP

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-xp:
    runs-on: windows-2022

    steps:
      - name: Obter codigo-fonte
        uses: actions/checkout@v4

      - name: Instalar conjunto de ferramentas v141_xp com ATL e MFC
        shell: cmd
        run: |
          start /wait "" "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\setup.exe" modify --quiet --norestart --nocache --productId Microsoft.VisualStudio.Product.Enterprise --channelId VisualStudio.17.Release --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 --add Microsoft.VisualStudio.Component.WinXP --add Microsoft.VisualStudio.Component.VC.v141.ATL --add Microsoft.VisualStudio.Component.VC.v141.MFC

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compilar solucao com destino Windows XP
        shell: cmd
        run: |
          msbuild Project64.sln /p:Configuration="Release for XP" /p:Platform="Win32" /p:PlatformToolset=v141_xp

      - name: Recolher executavel gerado
        shell: cmd
        run: |
          mkdir dist
          if exist "..\PJ64_1.6.2\Project64_1.6.3_XP.exe" copy "..\PJ64_1.6.2\Project64_1.6.3_XP.exe" dist\
          if exist "PJ64_1.6.2\Project64_1.6.3_XP.exe" copy "PJ64_1.6.2\Project64_1.6.3_XP.exe" dist\
          if not exist "dist\Project64_1.6.3_XP.exe" for /r . %%f in (Project64*.exe) do copy "%%f" dist\

      - name: Disponibilizar executavel para descarregar
        uses: actions/upload-artifact@v4
        with:
          name: Project64_1.6.3_XP
          path: dist/*.exe
